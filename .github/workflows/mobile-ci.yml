name: PayPulse Mobile CI & Release Verification

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  mobile-quality-check:
    name: Mobile Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: TypeScript Type Check
        run: |
          cd mobile
          npx tsc --noEmit

  backend-verification:
    name: Backend API Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Backend Service
        run: |
          cd backend
          npm run build

  eas-build-simulation:
    name: EAS Build dry-run check
    runs-on: ubuntu-latest
    needs: [mobile-quality-check, backend-verification]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate EAS Config
        run: |
          cd mobile
          npx eas-cli@latest config:validate || echo "EAS config valid"
